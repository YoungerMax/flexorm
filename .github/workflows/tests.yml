name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Sync workspace dependencies
        working-directory: src/
        run: |
          go work sync
          go mod download all

      - name: Build CLI
        working-directory: src/cli
        run: go build -o ../../test-workspace/database/flexorm
      
      - name: Generate client
        working-directory: test-workspace/database
        run: ./flexorm generate -o ../code/client.ts 

      - name: Install dependencies
        working-directory: test-workspace/code
        run: bun install

      - name: Run tests
        working-directory: test-workspace/code
        run: bun test
