<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexORM Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f1419;
            color: #e6edf3;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: "⚡";
            font-size: 24px;
        }

        .subtitle {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .tables-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .table-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
        }

        .table-item:hover {
            background: #21262d;
        }

        .table-item.active {
            background: #1f6feb;
        }

        .table-name {
            font-weight: 500;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-name::before {
            content: "📊";
            font-size: 14px;
        }

        .table-info {
            font-size: 12px;
            color: #8b949e;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 20px 24px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .table-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .table-meta {
            font-size: 14px;
            color: #8b949e;
        }

        .table-view {
            flex: 1;
            overflow: auto;
            padding: 24px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #161b22;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .data-table th {
            background: #21262d;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #e6edf3;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            font-size: 13px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tbody tr:hover {
            background: #21262d;
        }

        .null-value {
            color: #8b949e;
            font-style: italic;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background: #30363d;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            color: #8b949e;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .column-type {
            display: inline-block;
            background: #1f6feb20;
            color: #58a6ff;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: 500;
        }

        .pk-badge {
            display: inline-block;
            background: #f8514920;
            color: #f85149;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 4px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <div class="logo">FlexORM Studio</div>
                <div class="subtitle">Database Explorer</div>
            </div>
            <div class="tables-list" id="tablesList">
                <div class="loading">Loading tables...</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="content-header" id="contentHeader" style="display: none;">
                <div class="table-title" id="tableTitle"></div>
                <div class="table-meta" id="tableMeta"></div>
            </div>
            
            <div class="table-view" id="tableView">
                <div class="empty-state">
                    <div class="empty-state-icon">⚡</div>
                    <h2>Welcome to FlexORM Studio</h2>
                    <p>Select a table from the sidebar to view its data</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTable = null;
        let currentPage = 1;
        let tables = [];

        async function loadTables() {
            try {
                const res = await fetch('/api/tables');
                tables = await res.json();
                renderTablesList();
            } catch (err) {
                console.error('Failed to load tables:', err);
                document.getElementById('tablesList').innerHTML = 
                    '<div class="loading">Error loading tables</div>';
            }
        }

        function renderTablesList() {
            const list = document.getElementById('tablesList');
            list.innerHTML = tables.map(table => `
                <div class="table-item ${currentTable === table.name ? 'active' : ''}" 
                     onclick="selectTable('${table.name}')">
                    <div class="table-name">${table.name}</div>
                    <div class="table-info">
                        ${table.columns.length} columns • ${table.rowCount.toLocaleString()} rows
                    </div>
                </div>
            `).join('');
        }

        async function selectTable(tableName) {
            currentTable = tableName;
            currentPage = 1;
            renderTablesList();
            await loadTableData();
        }

        async function loadTableData() {
            const table = tables.find(t => t.name === currentTable);
            if (!table) return;

            document.getElementById('contentHeader').style.display = 'block';
            document.getElementById('tableTitle').textContent = currentTable;
            document.getElementById('tableMeta').innerHTML = 
                `${table.columns.length} columns • ${table.rowCount.toLocaleString()} total rows`;

            document.getElementById('tableView').innerHTML = 
                '<div class="loading">Loading data...</div>';

            try {
                const res = await fetch(`/api/table/${currentTable}?page=${currentPage}`);
                const data = await res.json();
                renderTableData(table, data);
            } catch (err) {
                console.error('Failed to load table data:', err);
                document.getElementById('tableView').innerHTML = 
                    '<div class="loading">Error loading data</div>';
            }
        }

        function renderTableData(table, data) {
            const totalPages = Math.ceil(data.total / data.perPage);
            
            const html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            ${table.columns.map(col => `
                                <th>
                                    ${col.name}
                                    <span class="column-type">${col.type}</span>
                                    ${col.primaryKey ? '<span class="pk-badge">PK</span>' : ''}
                                </th>
                            `).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${(data.rows ?? []).map(row => `
                            <tr>
                                ${data.columns.map(col => `
                                    <td>${row[col] === null ? '<span class="null-value">NULL</span>' : 
                                          escapeHtml(String(row[col]))}</td>
                                `).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                ${totalPages > 1 ? `
                    <div class="pagination">
                        <button onclick="changePage(${currentPage - 1})" 
                                ${currentPage === 1 ? 'disabled' : ''}>
                            Previous
                        </button>
                        <span class="page-info">
                            Page ${currentPage} of ${totalPages}
                        </span>
                        <button onclick="changePage(${currentPage + 1})" 
                                ${currentPage === totalPages ? 'disabled' : ''}>
                            Next
                        </button>
                    </div>
                ` : ''}
            `;
            
            document.getElementById('tableView').innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            loadTableData();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadTables();
    </script>
</body>
</html>
